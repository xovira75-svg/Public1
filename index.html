                  {!mine && <span className="group-sender-name">{m.fromName}</span>}
                  {m.type === "voice" ? (
                    <VoiceBubble src={m.audio} duration={m.duration} mine={mine} />
                  ) : (
                    <span className="bubble-text">{m.text}</span>
                  )}
                  <span className="bubble-meta">{fmtTime(m.ts)}</span>
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>

      <div className="input-bar">
        {recording ? (
          <div className="recording-row">
            <button className="icon-btn" onClick={cancelRecording}><X size={20} color="var(--danger)" /></button>
            <div className="recording-indicator"><span className="rec-dot" /> جارٍ التسجيل… {fmtClock(recSecs)}</div>
            <button className="send-btn" onClick={stopRecording}><Send size={19} color="#07130F" /></button>
          </div>
        ) : (
          <>
            <input className="chat-input" value={input} placeholder="اكتب رسالة…"
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); } }} />
            {input.trim() ? (
              <button className="send-btn" onClick={sendText}><Send size={19} color="#07130F" /></button>
            ) : (
              <button className="send-btn" onClick={startRecording}><Mic size={19} color="#07130F" /></button>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function GiftAnimation({ gift, mine, senderName }) {
  return (
    <div className="gift-anim-overlay">
      <div className="gift-anim-burst">
        {Array.from({ length: 10 }).map((_, i) => (
          <span key={i} className="gift-anim-particle" style={{
            "--tx": `${(Math.random() * 2 - 1) * 140}px`,
            "--ty": `${-(60 + Math.random() * 160)}px`,
            "--rot": `${(Math.random() * 2 - 1) * 60}deg`,
            animationDelay: `${i * 0.05}s`,
          }}>{gift.giftEmoji}</span>
        ))}
        <div className="gift-anim-center">
          <span className="gift-anim-emoji">{gift.giftEmoji}</span>
        </div>
      </div>
      <div className="gift-anim-caption">{mine ? "أنت أرسلت" : `${senderName} أرسل`} {gift.giftName} 🎉</div>
    </div>
  );
}

function GiftPickerModal({ coins, onClose, onPick }) {
  const [insufficientId, setInsufficientId] = useState(null);
  const pick = async (gift) => {
    const result = await onPick(gift);
    if (result === "insufficient") {
      setInsufficientId(gift.id);
      setTimeout(() => setInsufficientId(null), 1200);
    }
  };
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-title gift-modal-title">
          <span>إرسال هدية</span>
          <span className="coin-balance"><Coin size={16} color="#FFC94A" /> {coins.toLocaleString()}</span>
        </div>
        <div className="gift-grid">
          {GIFTS.map((g) => (
            <button
              key={g.id}
              className={"gift-cell" + (insufficientId === g.id ? " gift-cell-shake" : "") + (coins < g.cost ? " gift-cell-disabled" : "")}
              onClick={() => pick(g)}
            >
              <span className="gift-cell-emoji">{g.emoji}</span>
              <span className="gift-cell-name">{g.name}</span>
              <span className="gift-cell-cost"><Coin size={11} color="#FFC94A" /> {g.cost.toLocaleString()}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function VoiceBubble({ src, duration, mine }) {
  const audioRef = useRef(null);
  const [playing, setPlaying] = useState(false);
  const toggle = () => {
    if (!audioRef.current) return;
    if (playing) { audioRef.current.pause(); } else { audioRef.current.play(); }
  };
  return (
    <div className="voice-bubble">
      <audio ref={audioRef} src={src} onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} onEnded={() => setPlaying(false)} />
      <button className="voice-play-btn" onClick={toggle} style={{ background: mine ? "rgba(7,19,15,.25)" : "var(--accent)" }}>
        {playing ? <span className="voice-pause-icon" /> : <span className="voice-play-icon" />}
      </button>
      <div className="voice-wave">
        {Array.from({ length: 18 }).map((_, i) => (
          <span key={i} style={{ height: 6 + ((i * 37) % 14), background: mine ? "rgba(7,19,15,.35)" : "var(--text-dim)" }} />
        ))}
      </div>
      <span className="voice-duration">{fmtClock(duration || 0)}</span>
    </div>
  );
}

/* --------------------------- Incoming call overlay -------------------------- */
function IncomingCallOverlay({ call, onAccept, onDecline }) {
  return (
    <div className="call-overlay">
      <div className="call-bg-glow" />
      <div className="call-center">
        <div className="call-label">{call.type === "video" ? "مكالمة فيديو واردة" : "مكالمة صوتية واردة"}</div>
        <div className="ring-wrap">
          <span className="ring r1" /><span className="ring r2" /><span className="ring r3" />
          <Avatar name={call.callerName} emoji={call.callerEmoji} color={call.callerColor} size={116} />
        </div>
        <div className="call-name">{call.callerName}</div>
        <div className="call-sub">يتصل بك الآن…</div>
      </div>
      <div className="call-actions incoming-actions">
        <button className="call-round-btn decline" onClick={onDecline}><PhoneOff size={26} color="#fff" /></button>
        <button className="call-round-btn accept" onClick={onAccept}><Phone size={26} color="#07130F" /></button>
      </div>
    </div>
  );
}

/* -------------------------------- Call screen ------------------------------- */
function CallScreen({ call, localVideoRef, remoteVideoRef, onHangup, onToggleMute, onToggleVideo, onEnableAudio }) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    if (call.status !== "in-call" || !call.startTime) return;
    const iv = setInterval(() => setElapsed(Math.floor((Date.now() - call.startTime) / 1000)), 1000);
    return () => clearInterval(iv);
  }, [call.status, call.startTime]);

  const statusText =
    call.status === "calling" ? "جارٍ الاتصال…" :
    call.status === "connecting" ? "جارٍ الاتصال…" :
    call.status === "in-call" ? fmtClock(elapsed) : "";

  const isVideo = call.type === "video" && !call.videoOff;

  return (
    <div className="call-overlay">
      <video ref={remoteVideoRef} autoPlay playsInline
        style={
          call.type === "video" && call.status === "in-call"
            ? { display: "block" }
            : { position: "absolute", width: 2, height: 2, opacity: 0, pointerEvents: "none" }
        }
        className={call.type === "video" && call.status === "in-call" ? "remote-video" : ""} />
      {!(call.type === "video" && call.status === "in-call") && <div className="call-bg-glow" />}

      <div className="call-center" style={{ position: call.type === "video" && call.status === "in-call" ? "absolute" : "relative", top: call.type === "video" && call.status === "in-call" ? 40 : "auto" }}>
        {!(call.type === "video" && call.status === "in-call") && (
          <>
            <div className="call-label">{call.type === "video" ? "مكالمة فيديو" : "مكالمة صوتية"}</div>
            <div className="ring-wrap">
              {call.status !== "in-call" && <><span className="ring r1" /><span className="ring r2" /><span className="ring r3" /></>}
              {call.status === "in-call" && call.type === "audio" && (
                <div className="wave-bars">
                  {Array.from({ length: 5 }).map((_, i) => <span key={i} style={{ animationDelay: `${i * 0.12}s` }} />)}
                </div>
              )}
              <Avatar name={call.contact.name} emoji={call.contact.emoji} color={call.contact.color} size={116} />
            </div>
          </>
        )}
        <div className="call-name" style={call.type === "video" && call.status === "in-call" ? { textShadow: "0 2px 10px rgba(0,0,0,.6)" } : {}}>{call.contact.name}</div>
        <div className="call-sub" style={call.type === "video" && call.status === "in-call" ? { textShadow: "0 2px 10px rgba(0,0,0,.6)" } : {}}>{statusText}</div>
        {call.needsTapToPlay && call.status === "in-call" && (
          <button className="tap-audio-btn" onClick={onEnableAudio}>🔊 اضغط لتفعيل الصوت</button>
        )}
      </div>

      <video ref={localVideoRef} autoPlay playsInline muted
        style={{ display: isVideo ? "block" : "none" }}
        className="local-video-pip" />

      <div className="call-actions in-call-actions">
        <button className="call-round-btn secondary" onClick={onToggleMute}>
          {call.muted ? <MicOff size={22} color="#fff" /> : <Mic size={22} color="#fff" />}
        </button>
        {call.type === "video" && (
          <button className="call-round-btn secondary" onClick={onToggleVideo}>
            {call.videoOff ? <VideoOff size={22} color="#fff" /> : <Video size={22} color="#fff" />}
          </button>
        )}
        <button className="call-round-btn decline" onClick={onHangup}><PhoneOff size={24} color="#fff" /></button>
      </div>
    </div>
  );
}

/* ==================================== APP =================================== */
function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking, null = logged out, obj = logged in
  const [profile, setProfile] = useState(undefined);
  const [view, setView] = useState("home");
  const [mainTab, setMainTab] = useState("chats");
  const [activeContact, setActiveContact] = useState(null);
  const [activeGroup, setActiveGroup] = useState(null);
  const [showSearch, setShowSearch] = useState(false);
  const [chatlist, setChatlist] = useState({});
  const [toast, setToast] = useState(null);
  const [incomingCall, setIncomingCall] = useState(null);
  const [activeCall, setActiveCall] = useState(null);

  const activeContactRef = useRef(null);
  const activeCallRef = useRef(null);
  const incomingCallRef = useRef(null);
  const lastCallIdRef = useRef(null);
  const pcRef = useRef(null);
  const localStreamRef = useRef(null);
  const callPollRef = useRef(null);
  const localVideoRef = useRef(null);
  const remoteVideoRef = useRef(null);
  const ringIntervalRef = useRef(null);
  const ringCtxRef = useRef(null);

  useEffect(() => { activeContactRef.current = activeContact; }, [activeContact]);
  useEffect(() => { activeCallRef.current = activeCall; }, [activeCall]);
  useEffect(() => { incomingCallRef.current = incomingCall; }, [incomingCall]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast((t) => (t === msg ? null : t)), 2600); };

  /* ---- Firebase auth state ---- */
  useEffect(() => {
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      setAuthUser(u ? { uid: u.uid, email: u.email } : null);
      if (!u) {
        setProfile(undefined);
        setChatlist({});
        setView("home");
        setActiveContact(null);
      }
    });
    return () => unsub();
  }, []);

  /* ---- boot: load profile + chatlist once authenticated ---- */
  useEffect(() => {
    if (!authUser) return;
    (async () => {
      const p = await sGet("profile", false);
      if (p) {
        const withCoins = typeof p.coins === "number" ? p : { ...p, coins: 1000000 };
        setProfile(withCoins);
        if (withCoins !== p) await sSet("profile", withCoins, false);
        const cl = await sGet("chatlist", false);
        setChatlist(cl && cl.contacts ? cl.contacts : {});
      } else {
        setProfile(null);
      }
    })();
  }, [authUser]);

  const persistChatlist = (obj) => sSet("chatlist", { contacts: obj }, false);

  const handleCreateProfile = async ({ name, color, emoji }) => {
    const id = await generateUniqueId();
    const prof = { id, name, color, emoji, email: authUser.email, coins: 1000000 };
    await sSet(`users:${id}`, { id, name, color, emoji, lastSeen: Date.now() }, true);
    await sSet("profile", prof, false);
    setProfile(prof);
  };

  const spendCoins = async (amount) => {
    if (!profile || profile.coins < amount) return false;
    const updated = { ...profile, coins: profile.coins - amount };
    setProfile(updated);
    await sSet("profile", updated, false);
    return true;
  };

  const handleSignOut = async () => {
    await firebase.auth().signOut();
  };

  /* ---- presence heartbeat ---- */
  useEffect(() => {
    if (!profile) return;
    const beat = () => sSet(`users:${profile.id}`, { ...profile, lastSeen: Date.now() }, true);
    beat();
    const iv = setInterval(beat, 20000);
    return () => clearInterval(iv);
  }, [profile]);

  /* ---- inbox discovery (home badges) ---- */
  const refreshInbox = useCallback(async () => {
    if (!profile) return;
    const keys = await sList(`lastmsg:${profile.id}:`, true);
    if (!keys.length) return;
    let changed = false;
    const next = { ...chatlist };
    for (const k of keys) {
      const d = await sGet(k, true);
      if (!d) continue;
      const existing = next[d.otherId];
      if (existing && existing.ts >= d.ts) continue;
      const isOpen = activeContactRef.current && activeContactRef.current.id === d.otherId && view === "chat";
      next[d.otherId] = {
        id: d.otherId, name: d.otherName, emoji: d.otherEmoji, color: d.otherColor,
        preview: d.preview, ts: d.ts, unread: !isOpen,
      };
      changed = true;
    }
    if (changed) { setChatlist(next); persistChatlist(next); }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [profile, chatlist, view]);

  useEffect(() => {
    if (!profile) return;
    refreshInbox();
    const iv = setInterval(refreshInbox, 6000);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [profile, view]);

  const onSentFromChat = (contact, preview, ts) => {
    setChatlist((prev) => {
      const next = { ...prev, [contact.id]: { id: contact.id, name: contact.name, emoji: contact.emoji, color: contact.color, preview, ts, unread: false } };
      persistChatlist(next);
      return next;
    });
  };

  const openChat = (contact) => {
    setActiveContact(contact);
    setView("chat");
    setChatlist((prev) => {
      if (!prev[contact.id] || !prev[contact.id].unread) return prev;
      const next = { ...prev, [contact.id]: { ...prev[contact.id], unread: false } };
      persistChatlist(next);
      return next;
    });
  };

  const openGroup = (group) => {
    setActiveGroup(group);
    setView("group-chat");
  };

  /* ================= CALLING ================= */
  const logCall = (entry) => {
    const key = `callhistory:${Date.now()}_${Math.floor(Math.random() * 9999)}`;
    sSet(key, { ...entry, ts: entry.ts || Date.now() }, false);
  };

  function cleanupCall(outcomeOverride) {
    const call = activeCallRef.current;
    if (call) {
      const duration = call.startTime ? Math.floor((Date.now() - call.startTime) / 1000) : 0;
      const outcome = outcomeOverride || (call.startTime ? "answered" : (call.isCaller ? "no_answer" : "missed"));
      logCall({
        contactId: call.contact.id, contactName: call.contact.name, contactEmoji: call.contact.emoji, contactColor: call.contact.color,
        type: call.type, direction: call.isCaller ? "outgoing" : "incoming", outcome, duration,
      });
    }
    if (callPollRef.current) clearInterval(callPollRef.current);
    callPollRef.current = null;
    if (pcRef.current) { try { pcRef.current.close(); } catch (e) {} pcRef.current = null; }
    if (localStreamRef.current) { localStreamRef.current.getTracks().forEach((t) => t.stop()); localStreamRef.current = null; }
    if (localVideoRef.current) localVideoRef.current.srcObject = null;
    if (remoteVideoRef.current) remoteVideoRef.current.srcObject = null;
    stopRingtone();
    setActiveCall(null);
  }

  function playRingtone(freq, interval) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      ringCtxRef.current = ctx;
      const beep = () => {
        if (!ringCtxRef.current) return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = freq; o.type = "sine";
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.4);
      };
      beep();
      ringIntervalRef.current = setInterval(beep, interval);
    } catch (e) {}
  }
  function stopRingtone() {
    if (ringIntervalRef.current) clearInterval(ringIntervalRef.current);
    ringIntervalRef.current = null;
    if (ringCtxRef.current) { try { ringCtxRef.current.close(); } catch (e) {} ringCtxRef.current = null; }
  }

  function handleRemoteTrack(e) {
    if (!remoteVideoRef.current) return;
    remoteVideoRef.current.srcObject = e.streams[0];
    const p = remoteVideoRef.current.play();
    if (p && p.catch) {
      p.catch(() => {
        setActiveCall((prev) => (prev ? { ...prev, needsTapToPlay: true } : prev));
      });
    }
  }

  const startCall = async (contact, type) => {
    if (activeCallRef.current) return;
    setActiveCall({ callId: null, isCaller: true, type, status: "calling", contact, startTime: null, muted: false, videoOff: false });
    playRingtone(440, 3000);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: type === "video" });
      localStreamRef.current = stream;
      if (localVideoRef.current) localVideoRef.current.srcObject = stream;
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      pcRef.current = pc;
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      pc.ontrack = handleRemoteTrack;
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") {
          stopRingtone();
          setActiveCall((prev) => (prev ? { ...prev, status: "in-call", startTime: prev.startTime || Date.now() } : prev));
        }
      };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitIceGathering(pc);
      const callId = `${Date.now()}_${Math.floor(Math.random() * 9999)}`;
      setActiveCall((prev) => (prev ? { ...prev, callId } : prev));
      await sSet(`call:${contact.id}`, {
        callId, callerId: profile.id, callerName: profile.name, callerEmoji: profile.emoji, callerColor: profile.color,
        calleeId: contact.id, type, status: "ringing", offer: pc.localDescription.sdp, ts: Date.now(),
      }, true);
      callPollRef.current = setInterval(async () => {
        const doc = await sGet(`call:${contact.id}`, true);
        if (!doc || doc.callId !== callId) return;
        if (doc.status === "accepted" && doc.answer && pc.signalingState === "have-local-offer") {
          try { await pc.setRemoteDescription({ type: "answer", sdp: doc.answer }); } catch (e) {}
        } else if (doc.status === "declined") {
          showToast("تم رفض المكالمة");
          cleanupCall("declined");
        } else if (doc.status === "ended") {
          cleanupCall();
        }
      }, 2000);
    } catch (err) {
      showToast("تعذر الوصول إلى الميكروفون أو الكاميرا");
      cleanupCall();
    }
  };

  const acceptCall = async () => {
    const doc = incomingCall;
    if (!doc) return;
    setIncomingCall(null);
    setActiveCall({
      callId: doc.callId, isCaller: false, type: doc.type, status: "connecting",
      contact: { id: doc.callerId, name: doc.callerName, emoji: doc.callerEmoji, color: doc.callerColor },
      startTime: null, muted: false, videoOff: false,
    });
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: doc.type === "video" });
      localStreamRef.current = stream;
      if (localVideoRef.current) localVideoRef.current.srcObject = stream;
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      pcRef.current = pc;
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      pc.ontrack = handleRemoteTrack;
      pc.onconnectionstatechange = () => {
        if (pc.connectionState === "connected") {
          setActiveCall((prev) => (prev ? { ...prev, status: "in-call", startTime: prev.startTime || Date.now() } : prev));
        }
      };
      await pc.setRemoteDescription({ type: "offer", sdp: doc.offer });
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      await waitIceGathering(pc);
      await sSet(`call:${profile.id}`, { ...doc, status: "accepted", answer: pc.localDescription.sdp }, true);
      callPollRef.current = setInterval(async () => {
        const d = await sGet(`call:${profile.id}`, true);
        if (!d || d.callId !== doc.callId) return;
        if (d.status === "ended") cleanupCall();
      }, 2500);
    } catch (err) {
      showToast("تعذر قبول المكالمة");
      sSet(`call:${profile.id}`, { ...doc, status: "ended" }, true);
      cleanupCall();
    }
  };

  const declineCall = async () => {
    const doc = incomingCall;
    if (!doc) return;
    setIncomingCall(null);
    logCall({
      contactId: doc.callerId, contactName: doc.callerName, contactEmoji: doc.callerEmoji, contactColor: doc.callerColor,
      type: doc.type, direction: "incoming", outcome: "declined", duration: 0,
    });
    await sSet(`call:${profile.id}`, { ...doc, status: "declined" }, true);
  };

  const hangup = async () => {
    const call = activeCallRef.current;
    if (call) {
      const key = call.isCaller ? `call:${call.contact.id}` : `call:${profile.id}`;
      const existing = await sGet(key, true);
      if (existing) await sSet(key, { ...existing, status: "ended" }, true);
    }
    cleanupCall();
  };

  const toggleMute = () => {
    if (!localStreamRef.current) return;
    const track = localStreamRef.current.getAudioTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    setActiveCall((prev) => (prev ? { ...prev, muted: !track.enabled } : prev));
  };
  const toggleVideo = () => {
    if (!localStreamRef.current) return;
    const track = localStreamRef.current.getVideoTracks()[0];
    if (!track) return;
    track.enabled = !track.enabled;
    setActiveCall((prev) => (prev ? { ...prev, videoOff: !track.enabled } : prev));
  };

  const enableAudio = () => {
    if (remoteVideoRef.current) {
      remoteVideoRef.current.play().catch(() => {});
    }
    setActiveCall((prev) => (prev ? { ...prev, needsTapToPlay: false } : prev));
  };

  /* global poll for incoming calls */
  useEffect(() => {
    if (!profile) return;
    const iv = setInterval(async () => {
      if (activeCallRef.current || incomingCallRef.current) return;
      const doc = await sGet(`call:${profile.id}`, true);
      if (doc && doc.status === "ringing" && doc.callId !== lastCallIdRef.current) {
        lastCallIdRef.current = doc.callId;
        setIncomingCall(doc);
      }
    }, 3000);
    return () => clearInterval(iv);
  }, [profile]);

  /* auto-dismiss incoming call if caller cancels, + ringtone */
  useEffect(() => {
    if (!incomingCall) return;
    playRingtone(880, 1600);
    const iv = setInterval(async () => {
      const d = await sGet(`call:${profile.id}`, true);
      if (!d || d.status !== "ringing" || d.callId !== incomingCall.callId) {
        logCall({
          contactId: incomingCall.callerId, contactName: incomingCall.callerName, contactEmoji: incomingCall.callerEmoji, contactColor: incomingCall.callerColor,
          type: incomingCall.type, direction: "incoming", outcome: "missed", duration: 0,
        });
        setIncomingCall(null);
        stopRingtone();
      }
    }, 2000);
    return () => { clearInterval(iv); stopRingtone(); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [incomingCall]);

  if (authUser === undefined || (authUser && profile === undefined)) {
    return (<div className="nabd-root" dir="rtl"><style>{CSS}</style><SplashScreen /></div>);
  }

  return (
    <div className="nabd-root" dir="rtl" lang="ar">
      <style>{CSS}</style>
      <div className="app-shell">
        {authUser === null && <LoginScreen />}
        {authUser && profile === null && <ProfileSetupScreen onCreate={handleCreateProfile} />}

        {profile && view === "home" && (
          <MainTabsScreen
            tab={mainTab} onChangeTab={setMainTab}
            homeProps={{
              profile, chatlist,
              onOpenChat: openChat,
              onOpenSearch: () => setShowSearch(true),
              onOpenSettings: () => setView("settings"),
            }}
            updatesProps={{ profile, chatlist, onOpenSettings: () => setView("settings") }}
            communitiesProps={{ profile, onOpenGroup: openGroup, onOpenSettings: () => setView("settings") }}
            callsProps={{ profile, onCall: startCall, onOpenSettings: () => setView("settings") }}
          />
        )}
        {profile && view === "chat" && activeContact && (
          <ChatScreen
            profile={profile} contact={activeContact}
            onBack={() => setView("home")}
            onSent={onSentFromChat}
            onStartCall={startCall}
            coins={profile.coins || 0} onSpendCoins={spendCoins}
          />
        )}
        {profile && view === "group-chat" && activeGroup && (
          <GroupChatScreen profile={profile} group={activeGroup} onBack={() => setView("home")} />
        )}
        {profile && view === "settings" && (
          <SettingsScreen profile={profile} authEmail={authUser && authUser.email} onBack={() => setView("home")} onSignOut={handleSignOut} onToast={showToast} />
        )}

        {showSearch && profile && (
          <SearchModal
            profile={profile}
            onClose={() => setShowSearch(false)}
            onFound={(u) => { setShowSearch(false); openChat(u); }}
          />
        )}

        {incomingCall && (
          <IncomingCallOverlay call={incomingCall} onAccept={acceptCall} onDecline={declineCall} />
        )}
        {activeCall && (
          <CallScreen
            call={activeCall}
            localVideoRef={localVideoRef} remoteVideoRef={remoteVideoRef}
            onHangup={hangup} onToggleMute={toggleMute} onToggleVideo={toggleVideo} onEnableAudio={enableAudio}
          />
        )}

        {toast && <div className="toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ==================================== CSS ==================================== */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#070D0B; --bg-elevated:#0F1613; --card:#131C19; --card-hover:#182220;
  --border:#1F2B27; --accent:#17E9A5; --accent-dim:#0EA57C; --accent-2:#22D3EE;
  --text:#EAF6F1; --text-dim:#8FA79D; --text-faint:#4B5C54; --danger:#FF5470;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0; padding:0; overflow:hidden; overscroll-behavior:none;}
.nabd-root{
  position:fixed; inset:0;
  background: radial-gradient(circle at 20% 0%, rgba(23,233,165,.10), transparent 45%),
              radial-gradient(circle at 100% 100%, rgba(34,211,238,.08), transparent 40%),
              var(--bg);
  font-family:'Tajawal', sans-serif; color:var(--text);
  display:flex; align-items:flex-start; justify-content:center;
}
.app-shell{
  width:100%; max-width:480px; height:100%;
  background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (min-width:560px){
  .nabd-root{ align-items:center; }
  .app-shell{ border-radius:30px; box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px var(--border);
    margin:20px 0; height:calc(100% - 40px); max-height:860px; }
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

.center-fill{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:var(--bg);}
.brand-word{font-weight:900; font-size:30px; letter-spacing:1px; color:var(--text);}
.pulse-path{ stroke-dasharray:220; stroke-dashoffset:220; animation:draw 1.8s ease-in-out infinite; }
@keyframes draw{ 0%{stroke-dashoffset:220;} 55%{stroke-dashoffset:0;} 100%{stroke-dashoffset:0; opacity:.35;} }
.pulse-logo{ filter:drop-shadow(0 0 10px rgba(23,233,165,.5)); }

/* ---------- auth ---------- */
.auth-screen{display:flex; flex-direction:column; height:100%; padding:28px 22px; overflow-y:auto;}
.auth-top{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px;}
.auth-tag{color:var(--text-dim); font-size:13.5px; margin-top:10px; max-width:300px; line-height:1.7;}
.auth-card{background:var(--card); border:1px solid var(--border); border-radius:22px; padding:22px; margin-top:6px; animation:slideIn .5s ease;}
.avatar-preview{display:flex; justify-content:center; margin-bottom:18px;}
.field-label{font-size:12.5px; color:var(--text-dim); font-weight:700; display:block; margin:14px 0 8px;}
.text-input{width:100%; background:var(--bg-elevated); border:1.5px solid var(--border); border-radius:13px; padding:13px 14px; color:var(--text); font-size:15px; outline:none; transition:border-color .15s;}
.text-input:focus{border-color:var(--accent);}
.mono-input{font-family:'Space Mono', monospace; letter-spacing:3px; font-size:18px; text-align:center;}
.swatch-row{display:flex; gap:10px; flex-wrap:wrap;}
.swatch{width:34px; height:34px; border-radius:50%; border:2px solid transparent; transition:transform .15s;}
.swatch-active{border-color:var(--text); transform:scale(1.12);}
.emoji-row{display:flex; gap:8px; flex-wrap:wrap;}
.emoji-btn{width:38px; height:38px; border-radius:12px; background:var(--bg-elevated); font-size:19px; display:flex; align-items:center; justify-content:center; border:1.5px solid transparent;}
.emoji-active{border-color:var(--accent); background:rgba(23,233,165,.12);}
.primary-btn{width:100%; margin-top:20px; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); color:#07130F; font-weight:800; font-size:15.5px; padding:14px; border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px; transition:opacity .15s, transform .1s;}
.primary-btn:active{transform:scale(.98);}
.primary-btn:disabled{opacity:.45; cursor:default;}
.small-btn{width:auto; margin-top:0; padding:13px 20px;}
.auth-foot{color:var(--text-faint); font-size:12px; text-align:center; margin-top:14px; line-height:1.6;}
.mode-tabs{display:flex; background:var(--bg-elevated); border-radius:12px; padding:4px; gap:4px; margin-bottom:6px;}
.mode-tab{flex:1; padding:10px; border-radius:9px; font-weight:700; font-size:13.5px; color:var(--text-dim); transition:background .15s, color .15s;}
.mode-tab-active{background:var(--card); color:var(--accent);}
.auth-error{background:rgba(255,84,112,.12); border:1px solid rgba(255,84,112,.35); color:#FF8FA3; font-size:13px; padding:10px 12px; border-radius:11px; margin-top:14px; line-height:1.6;}
.settings-email{color:var(--text-dim); font-size:12.5px; margin-bottom:14px; direction:ltr; font-family:'Space Mono', monospace;}
.spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid rgba(7,19,15,.3); border-top-color:#07130F; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- generic screen ---------- */
.screen{display:flex; flex-direction:column; height:100%; position:relative; animation:fadeSlideUp .3s ease; min-height:0;}
.tab-content{flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
.bottom-nav{display:flex; border-top:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom, 0px);}
.bottom-nav-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 4px 8px; color:var(--text-faint); transition:color .15s;}
.bottom-nav-btn.active{color:var(--accent);}
.bottom-nav-label{font-size:10.5px; font-weight:700;}
@keyframes fadeSlideUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.top-bar{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0;}
.top-title{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:17px;}
.icon-btn{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:background .15s; flex-shrink:0;}
.icon-btn:hover{background:var(--card-hover);}

/* ---------- home / chat list ---------- */
.empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px;}
.empty-pulse{margin-bottom:14px; opacity:.8;}
.empty-title{font-weight:800; font-size:18px; margin-bottom:6px;}
.empty-sub{color:var(--text-dim); font-size:13.5px; max-width:260px; line-height:1.7; margin-bottom:20px;}
.id-badge{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 18px; margin-bottom:18px;}
.id-badge-click{transition:border-color .15s;}
.id-badge-click:hover{border-color:var(--accent);}
.id-badge-label{color:var(--text-dim); font-size:12.5px; font-weight:700;}
.id-mono{font-family:'Space Mono', monospace; font-size:19px; font-weight:700; letter-spacing:3px; color:var(--accent);}
.secondary-btn{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); padding:12px 20px; border-radius:13px; font-weight:700; font-size:14px; color:var(--text);}
.secondary-btn:hover{border-color:var(--accent);}

.chat-list{flex:1; overflow-y:auto; padding:6px 0;}
.chat-row{width:100%; display:flex; align-items:center; gap:13px; padding:12px 16px; text-align:start; transition:background .12s;}
.chat-row:hover{background:var(--card-hover);}
.chat-row-mid{flex:1; min-width:0; border-bottom:1px solid var(--border); padding-bottom:12px;}
.chat-row-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
.chat-row-name{font-weight:700; font-size:15px;}
.chat-row-time{font-size:11.5px; color:var(--text-faint); font-family:'Space Mono', monospace;}
.chat-row-bottom{display:flex; justify-content:space-between; align-items:center; gap:8px;}
.chat-row-preview{color:var(--text-dim); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;}
.unread-dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); flex-shrink:0;}
.fab{position:absolute; bottom:24px; inset-inline-start:20px; width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(23,233,165,.35); transition:transform .15s;}
.fab:active{transform:scale(.92);}

/* ---------- search modal ---------- */
.modal-backdrop{position:absolute; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(2px); display:flex; align-items:flex-end; z-index:40; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.modal-sheet{width:100%; background:var(--bg-elevated); border-radius:24px 24px 0 0; padding:14px 20px 26px; border-top:1px solid var(--border); animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-handle{width:40px; height:4px; border-radius:4px; background:var(--border); margin:0 auto 16px;}
.modal-title{font-weight:800; font-size:17px; margin-bottom:14px; text-align:center;}
.search-row{display:flex; gap:10px;}
.search-msg{text-align:center; color:var(--text-dim); font-size:14px; padding:18px 0; display:flex; justify-content:center;}
.found-card{display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 0 4px; animation:fadeSlideUp .25s ease;}
.found-name{font-weight:800; font-size:16px; margin-top:8px;}
.found-id{margin-bottom:14px;}

/* ---------- settings ---------- */
.settings-body{flex:1; display:flex; flex-direction:column; align-items:center; padding:34px 24px;}
.settings-avatar{margin-bottom:16px;}
.settings-name{font-weight:800; font-size:19px; margin-bottom:14px;}
.settings-divider{width:100%; height:1px; background:var(--border); margin:26px 0;}
.danger-ghost-btn{display:flex; align-items:center; gap:8px; color:var(--danger); font-weight:700; font-size:14px; padding:10px 16px;}
.confirm-box{width:100%; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; text-align:center;}
.confirm-text{color:var(--text-dim); font-size:13.5px; line-height:1.7; margin-bottom:14px;}
.confirm-actions{display:flex; gap:10px;}
.confirm-actions .secondary-btn, .confirm-actions .danger-btn{flex:1; justify-content:center;}
.danger-btn{display:flex; align-items:center; gap:6px; justify-content:center; background:var(--danger); color:#fff; font-weight:700; font-size:14px; padding:12px; border-radius:13px;}

/* ---------- chat screen ---------- */
.chat-top-mid{flex:1; min-width:0;}
.chat-top-name{font-weight:800; font-size:15.5px;}
.chat-top-status{font-size:12px; color:var(--accent); margin-top:1px;}
.call-row-bottom{gap:6px;}
.group-sender-name{font-size:11.5px; font-weight:800; color:var(--accent-2); display:block; margin-bottom:2px;}

/* ---------- updates / status ---------- */
.status-add-badge{position:absolute; bottom:-2px; inset-inline-end:-2px; width:18px; height:18px; border-radius:50%; background:var(--accent); border:2px solid var(--bg-elevated); display:flex; align-items:center; justify-content:center;}
.status-section-label{padding:14px 16px 6px; font-size:12px; font-weight:800; color:var(--text-dim);}
.status-ring{border-radius:50%; padding:2px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex;}
.status-preview{border-radius:16px; padding:24px 16px; min-height:140px; display:flex; align-items:center; justify-content:center; margin-top:4px;}
.status-textarea{width:100%; background:transparent; border:none; outline:none; color:#fff; font-size:19px; font-weight:700; text-align:center; resize:none; font-family:inherit; min-height:90px;}
.status-viewer{position:absolute; inset:0; z-index:75; display:flex; flex-direction:column; padding:16px 18px; animation:fadeIn .2s ease;}
.status-viewer-progress{height:3px; background:rgba(255,255,255,.3); border-radius:3px; overflow:hidden; margin-bottom:14px;}
.status-viewer-progress span{display:block; height:100%; width:100%; background:#fff; animation:statusProgress 6s linear forwards;}
@keyframes statusProgress{from{transform:translateX(-100%);} to{transform:translateX(0);}}
.status-viewer-header{display:flex; align-items:center; gap:10px;}
.status-viewer-name{color:#fff; font-weight:800; font-size:14px;}
.status-viewer-time{color:rgba(255,255,255,.75); font-size:12px; margin-inline-start:auto; font-family:'Space Mono', monospace;}
.status-viewer-text{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:24px; font-weight:800; padding:20px; line-height:1.5;}
.status-delete-btn{align-self:center; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.4); color:#fff; font-size:13px; font-weight:700; padding:10px 20px; border-radius:20px; margin-bottom:10px;}

/* ---------- group creation ---------- */
.member-list{max-height:280px; overflow-y:auto; margin-top:8px; display:flex; flex-direction:column; gap:6px;}
.member-row{display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:13px; background:var(--card); border:1px solid var(--border);}
.member-row-active{border-color:var(--accent); background:rgba(23,233,165,.08);}
.member-row-name{font-size:14px; font-weight:600; flex:1; text-align:start;}
.messages-area{flex:1; overflow-y:auto; padding:16px 12px; display:flex; flex-direction:column; gap:8px; background:
  repeating-linear-gradient(135deg, rgba(255,255,255,.012) 0px, rgba(255,255,255,.012) 2px, transparent 2px, transparent 30px);}
.day-chip{align-self:center; background:var(--card); color:var(--text-dim); font-size:11.5px; font-weight:700; padding:5px 14px; border-radius:20px; margin:8px 0;}
.bubble{max-width:78%; padding:9px 12px 7px; border-radius:16px; display:flex; flex-direction:column; gap:2px; animation:popIn .18s ease;}
@keyframes popIn{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
.bubble-mine{background:linear-gradient(135deg,var(--accent),var(--accent-dim)); color:#07130F; border-end-end-radius:4px;}
.bubble-other{background:var(--card); color:var(--text); border-end-start-radius:4px; border:1px solid var(--border);}
.bubble-text{font-size:14.5px; line-height:1.5; white-space:pre-wrap; word-break:break-word;}
.bubble-meta{align-self:flex-end; display:flex; align-items:center; gap:3px; font-size:10.5px; opacity:.75; font-family:'Space Mono', monospace;}
.typing-bubble{display:flex; flex-direction:row; gap:4px; padding:12px 14px; align-items:center;}
.typing-dot{width:6px; height:6px; border-radius:50%; background:var(--text-dim); animation:typingBlink 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;} .typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes typingBlink{0%,60%,100%{opacity:.3;} 30%{opacity:1;}}

.voice-bubble{display:flex; align-items:center; gap:8px; min-width:170px; padding:2px;}
.voice-play-btn{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.voice-play-icon{width:0; height:0; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #07130F; margin-inline-start:2px;}
.voice-pause-icon{width:9px; height:9px; border-inline-start:3px solid #07130F; border-inline-end:3px solid #07130F;}
.voice-wave{display:flex; align-items:center; gap:2px; flex:1; height:20px;}
.voice-wave span{width:2.5px; border-radius:2px;}
.voice-duration{font-size:11px; font-family:'Space Mono', monospace; opacity:.8;}

/* ---------- gifts ---------- */
.gift-trigger-btn{width:42px; height:42px; border-radius:50%; background:var(--card); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.bubble-gift{background:linear-gradient(135deg, #2A1B45, #1B1030) !important; border:1px solid rgba(232,121,249,.35) !important;}
.gift-bubble-content{display:flex; align-items:center; gap:9px; padding:4px 6px;}
.gift-bubble-emoji{font-size:34px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
.gift-bubble-name{font-weight:800; font-size:14px; color:#F0D9FF;}
.gift-bubble-cost{display:flex; align-items:center; gap:3px; font-size:11px; color:#FFC94A; font-family:'Space Mono', monospace; margin-inline-start:auto;}
.gift-modal-title{display:flex; align-items:center; justify-content:space-between;}
.coin-balance{display:flex; align-items:center; gap:5px; font-size:13px; font-weight:700; color:#FFC94A; font-family:'Space Mono', monospace; background:rgba(255,201,74,.1); padding:5px 11px; border-radius:20px;}
.gift-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; padding:16px 0 6px;}
.gift-cell{display:flex; flex-direction:column; align-items:center; gap:3px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 4px; transition:transform .1s, border-color .15s;}
.gift-cell:active{transform:scale(.93);}
.gift-cell-disabled{opacity:.4;}
.gift-cell-shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);}}
.gift-cell-emoji{font-size:28px;}
.gift-cell-name{font-size:11px; font-weight:700; color:var(--text-dim);}
.gift-cell-cost{display:flex; align-items:center; gap:2px; font-size:10px; color:#FFC94A; font-family:'Space Mono', monospace;}

.gift-anim-overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; z-index:70; overflow:hidden;}
.gift-anim-burst{position:relative; width:10px; height:10px; display:flex; align-items:center; justify-content:center;}
.gift-anim-center{animation:giftPop 2.6s ease forwards;}
.gift-anim-emoji{font-size:92px; display:block; filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));}
@keyframes giftPop{
  0%{transform:scale(.2) rotate(-15deg); opacity:0;}
  15%{transform:scale(1.3) rotate(8deg); opacity:1;}
  25%{transform:scale(1) rotate(0deg); opacity:1;}
  80%{transform:scale(1) translateY(0); opacity:1;}
  100%{transform:scale(.8) translateY(-40px); opacity:0;}
}
.gift-anim-particle{position:absolute; font-size:26px; opacity:0; animation:giftParticle 1.8s ease-out forwards;}
@keyframes giftParticle{
  0%{transform:translate(0,0) scale(.4) rotate(0deg); opacity:0;}
  15%{opacity:1;}
  100%{transform:translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity:0;}
}
.gift-anim-caption{margin-top:18px; background:rgba(0,0,0,.55); color:#fff; font-weight:800; font-size:14px; padding:9px 20px; border-radius:20px; animation:fadeSlideUp .3s ease; text-shadow:0 2px 6px rgba(0,0,0,.5);}

.input-bar{display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--border); background:var(--bg-elevated); flex-shrink:0;}
.chat-input{flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:22px; padding:11px 16px; color:var(--text); font-size:14.5px; outline:none;}
.chat-input:focus{border-color:var(--accent);}
.send-btn{width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-dim)); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:transform .1s;}
.send-btn:active{transform:scale(.9);}
.recording-row{display:flex; align-items:center; gap:10px; flex:1;}
.recording-indicator{flex:1; display:flex; align-items:center; gap:8px; color:var(--danger); font-size:13.5px; font-weight:700; font-family:'Space Mono', monospace;}
.rec-dot{width:9px; height:9px; border-radius:50%; background:var(--danger); animation:recordPulse 1s infinite;}
@keyframes recordPulse{0%,100%{opacity:1;} 50%{opacity:.25;}}

/* ---------- calls ---------- */
.call-overlay{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:space-between; z-index:60; padding:50px 24px 40px; overflow:hidden;}
.call-bg-glow{position:absolute; inset:0; background:radial-gradient(circle at 50% 20%, rgba(23,233,165,.16), transparent 55%); pointer-events:none;}
.call-center{display:flex; flex-direction:column; align-items:center; gap:10px; z-index:1; width:100%;}
.call-label{color:var(--text-dim); font-size:13px; font-weight:700; letter-spacing:.5px;}
.ring-wrap{position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; margin:14px 0;}
.ring{position:absolute; border-radius:50%; border:2px solid var(--accent); opacity:0; animation:ringPulse 2.4s ease-out infinite;}
.r1{width:116px; height:116px;} .r2{width:116px; height:116px; animation-delay:.6s;} .r3{width:116px; height:116px; animation-delay:1.2s;}
@keyframes ringPulse{0%{width:116px; height:116px; opacity:.55;} 100%{width:200px; height:200px; opacity:0;}}
.call-name{font-weight:800; font-size:22px; margin-top:4px;}
.call-sub{color:var(--text-dim); font-size:14px; font-family:'Space Mono', monospace;}
.tap-audio-btn{margin-top:16px; background:var(--accent); color:#07130F; font-weight:800; font-size:13.5px; padding:11px 18px; border-radius:14px; animation:recordPulse 1.6s infinite;}
.wave-bars{position:absolute; display:flex; align-items:center; gap:4px; z-index:2;}
.wave-bars span{width:4px; height:14px; background:var(--accent); border-radius:3px; animation:wave 1s ease-in-out infinite;}
@keyframes wave{0%,100%{transform:scaleY(.4);} 50%{transform:scaleY(1.3);}}
.call-actions{display:flex; align-items:center; gap:28px; z-index:1;}
.incoming-actions{width:100%; justify-content:space-around;}
.in-call-actions{gap:22px;}
.call-round-btn{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:transform .12s;}
.call-round-btn:active{transform:scale(.9);}
.call-round-btn.accept{background:linear-gradient(135deg,var(--accent),var(--accent-dim)); box-shadow:0 8px 24px rgba(23,233,165,.4);}
.call-round-btn.decline{background:linear-gradient(135deg,#FF5470,#B91C3C); box-shadow:0 8px 24px rgba(255,84,112,.4);}
.call-round-btn.secondary{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14);}
.remote-video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000;}
