/* ---- Storage layer: backed by Firebase Realtime Database, scoped by the
   signed-in user's uid for "personal" data and a shared flat namespace for
   "shared" data (users, messages, calls, ...). Mirrors the get/set/list/
   delete shape the rest of the app already expects. */
(function () {
  try {
    var db = firebase.database();
    function personalPath(key) {
      var u = firebase.auth().currentUser;
      return "kv_personal/" + (u ? u.uid : "anon") + "/" + key;
    }
    function sharedPath(key) { return "kv_shared/" + key; }

    window.storage = {
      get: function (key, shared) {
        var path = shared ? sharedPath(key) : personalPath(key);
        return db.ref(path).once("value").then(function (snap) {
          if (!snap.exists()) throw new Error("not found");
          return { key: key, value: snap.val(), shared: !!shared };
        });
      },
      set: function (key, value, shared) {
        var path = shared ? sharedPath(key) : personalPath(key);
        return db.ref(path).set(value).then(function () {
          return { key: key, value: value, shared: !!shared };
        });
      },
      delete: function (key, shared) {
        var path = shared ? sharedPath(key) : personalPath(key);
        return db.ref(path).remove().then(function () {
          return { key: key, deleted: true, shared: !!shared };
        });
      },
      list: function (prefix, shared) {
        var basePath = shared ? "kv_shared" : ("kv_personal/" + (firebase.auth().currentUser ? firebase.auth().currentUser.uid : "anon"));
        var ref = db.ref(basePath);
        var q = prefix ? ref.orderByKey().startAt(prefix).endAt(prefix + "\uf8ff") : ref;
        return q.once("value").then(function (snap) {
          var keys = [];
          snap.forEach(function (child) { keys.push(child.key); });
          return { keys: keys, prefix: prefix, shared: !!shared };
        });
      },
    };
  } catch (e) {
    window.__initError = e;
  }
})();

/* ------------------------------ storage helpers ------------------------- */
async function sGet(key, shared = false) {
  try {
    const r = await window.storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  } catch (e) {
    return null;
  }
}
async function sSet(key, value, shared = false) {
  try {
    await window.storage.set(key, JSON.stringify(value), shared);
    return true;
  } catch (e) {
    console.error("storage.set failed", e);
    return false;
  }
}
async function sList(prefix, shared = false) {
  try {
    const r = await window.storage.list(prefix, shared);
    return r && r.keys ? r.keys : [];
  } catch (e) {
    return [];
  }
}

function convIdOf(a, b) { return [a, b].sort().join("-"); }
function fmtTime(ts) {
  try {
    return new Date(ts).toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return ""; }
}
function dayLabel(ts) {
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return "اليوم";
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  if (d.toDateString() === yest.toDateString()) return "أمس";
  return d.toLocaleDateString("ar-EG", { day: "numeric", month: "long" });
}
function fmtClock(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}
async function generateUniqueId() {
  for (let i = 0; i < 25; i++) {
    const id = String(Math.floor(100000 + Math.random() * 900000));
    const exists = await sGet(`users:${id}`, true);
    if (!exists) return id;
  }
  return String(Date.now()).slice(-6);
}
function waitIceGathering(pc) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === "complete") { resolve(); return; }
    const check = () => {
      if (pc.iceGatheringState === "complete") {
        pc.removeEventListener("icegatheringstatechange", check);
        resolve();
      }
    };
    pc.addEventListener("icegatheringstatechange", check);
    setTimeout(() => { pc.removeEventListener("icegatheringstatechange", check); resolve(); }, 2500);
  });
}

    "auth/invalid-credential": "البريد الإلكتروني أو كلمة المرور غير صحيحة",
    "auth/missing-password": "أدخل كلمة المرور",
    "auth/too-many-requests": "محاولات كثيرة جدًا، حاول لاحقًا",
    "auth/network-request-failed": "تحقق من اتصالك بالإنترنت",
  };

function LoginScreen() {
  const [mode, setMode] = useState("login"); // 'login' | 'signup'
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  const submit = async () => {
    if (busy) return;
    if (!email.trim() || password.length < 6) {
      setError("أدخل بريدًا إلكترونيًا صحيحًا وكلمة مرور من ٦ أحرف على الأقل");
      return;
    }
    setBusy(true); setError("");
    try {
      if (mode === "signup") {
        await firebase.auth().createUserWithEmailAndPassword(email.trim(), password);
      } else {
        await firebase.auth().signInWithEmailAndPassword(email.trim(), password);
      }
      // onAuthStateChanged in App() picks this up automatically from here.
    } catch (e) {
      setError(mapFirebaseError(e.code) + (e.code ? " [" + e.code + "]" : " [" + String(e.message || e).slice(0, 80) + "]"));
      setBusy(false);
    }
  };

  return (
    <div className="auth-screen">
      <div className="auth-top">
        <PulseMark size={40} />
        <div className="brand-word" style={{ marginTop: 10 }}>نبض</div>
        <div className="auth-tag">تطبيق مراسلة واتصال حقيقي — سجّل الدخول أو أنشئ حسابًا ببريدك الإلكتروني.</div>
      </div>

      <div className="auth-card">
        <div className="mode-tabs">
          <button className={"mode-tab" + (mode === "login" ? " mode-tab-active" : "")} onClick={() => { setMode("login"); setError(""); }}>تسجيل الدخول</button>
          <button className={"mode-tab" + (mode === "signup" ? " mode-tab-active" : "")} onClick={() => { setMode("signup"); setError(""); }}>إنشاء حساب</button>
        </div>

        <label className="field-label">البريد الإلكتروني</label>
        <input
          className="text-input" type="email" value={email} dir="ltr"
          onChange={(e) => setEmail(e.target.value)}
          placeholder="you@example.com"
        />

        <label className="field-label">كلمة المرور</label>
        <input
          className="text-input" type="password" value={password} dir="ltr"
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="٦ أحرف على الأقل"
        />

        {error && <div className="auth-error">{error}</div>}

        <button className="primary-btn" disabled={busy} onClick={submit}>
          {busy ? <span className="spinner" /> : (mode === "signup" ? "إنشاء الحساب" : "تسجيل الدخول")}
        </button>
        <div className="auth-foot">حسابك محفوظ بأمان، ويمكنك الدخول من أي جهاز بنفس البريد وكلمة المرور.</div>
      </div>
    </div>
  );
}

/* ------------------------------- calls tab ------------------------------- */
function outcomeLabel(entry) {
  if (entry.outcome === "answered") return entry.direction === "outgoing" ? "مكالمة صادرة" : "مكالمة واردة";
  if (entry.outcome === "declined") return entry.direction === "outgoing" ? "تم الرفض" : "رفضتها";
  if (entry.outcome === "no_answer") return "لم يتم الرد";
  if (entry.outcome === "missed") return "مكالمة فائتة";
  return "مكالمة";
}
function CallsScreen({ profile, onCall, onOpenSettings }) {
  const [entries, setEntries] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const keys = await sList("callhistory:", false);
      keys.sort().reverse();
      const top = keys.slice(0, 80);
      const items = [];
      for (const k of top) {
        const v = await sGet(k, false);
        if (v) items.push(v);
      }
      if (!cancelled) setEntries(items);
    })();
    return () => { cancelled = true; };
  }, []);

  return (
    <div className="screen">
      <div className="top-bar">
        <button className="icon-btn" onClick={onOpenSettings}>
          <Avatar name={profile.name} emoji={profile.emoji} color={profile.color} size={34} />
        </button>
        <div className="top-title"><span>المكالمات</span></div>
        <div style={{ width: 38 }} />
      </div>

      {entries === null ? (
        <div className="empty-state"><span className="spinner" /></div>
      ) : entries.length === 0 ? (
        <div className="empty-state">
          <div className="empty-pulse"><History size={38} color="var(--text-faint)" /></div>
          <div className="empty-title">لا مكالمات بعد</div>
          <div className="empty-sub">سجل مكالماتك الصوتية والمرئية بيظهر هنا.</div>
        </div>
      ) : (
        <div className="chat-list">
          {entries.map((e, i) => {
            const missed = e.outcome === "missed" || (e.outcome === "declined" && e.direction === "incoming");
            return (
              <button key={i} className="chat-row" onClick={() => onCall({ id: e.contactId, name: e.contactName, emoji: e.contactEmoji, color: e.contactColor }, e.type)}>
                <Avatar name={e.contactName} emoji={e.contactEmoji} color={e.contactColor} size={50} />
                <div className="chat-row-mid">
                  <div className="chat-row-top">
                    <span className="chat-row-name" style={missed ? { color: "var(--danger)" } : {}}>{e.contactName}</span>
                    <span className="chat-row-time">{fmtTime(e.ts)}</span>
                  </div>
                  <div className="chat-row-bottom call-row-bottom">
                    {e.direction === "outgoing" ? <PhoneOutgoing size={13} color="var(--text-faint)" /> : missed ? <PhoneMissed size={13} color="var(--danger)" /> : <PhoneIncoming size={13} color="var(--text-faint)" />}
                    <span className="chat-row-preview">{outcomeLabel(e)}{e.outcome === "answered" ? ` · ${fmtClock(e.duration)}` : ""}</span>
                  </div>
                </div>
                {e.type === "video" ? <Video size={18} color="var(--accent)" /> : <Phone size={18} color="var(--accent)" />}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

const STATUS_BG = ["#0EA57C", "#0369A1", "#6D28D9", "#BE123C", "#B45309", "#4D7C0F"];
function UpdatesScreen({ profile, chatlist, onOpenSettings }) {
  const [myStatus, setMyStatus] = useState(undefined);
  const [friendStatuses, setFriendStatuses] = useState([]);
  const [composing, setComposing] = useState(false);
  const [viewing, setViewing] = useState(null);

  const load = async () => {
    const mine = await sGet(`status:${profile.id}`, true);
    setMyStatus(mine && mine.expiresAt > Date.now() ? mine : null);
    const contacts = Object.values(chatlist || {});
    const results = [];
    for (const c of contacts) {
      const s = await sGet(`status:${c.id}`, true);
      if (s && s.expiresAt > Date.now()) results.push(s);
    }
    setFriendStatuses(results.sort((a, b) => b.ts - a.ts));
  };

  useEffect(() => {
    load();
    const iv = setInterval(load, 15000);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [chatlist]);

  const postStatus = async (text, bg) => {
    const ts = Date.now();
    const s = { userId: profile.id, name: profile.name, emoji: profile.emoji, color: profile.color, text, bg, ts, expiresAt: ts + 24 * 3600 * 1000 };
    await sSet(`status:${profile.id}`, s, true);
    setMyStatus(s);
    setComposing(false);
  };

  const deleteStatus = async () => {
    await sSet(`status:${profile.id}`, { ...myStatus, expiresAt: 0 }, true);
    setMyStatus(null);
  };

  return (
    <div className="screen">
      <div className="top-bar">
        <button className="icon-btn" onClick={onOpenSettings}>
          <Avatar name={profile.name} emoji={profile.emoji} color={profile.color} size={34} />
        </button>
        <div className="top-title"><span>التحديثات</span></div>
        <div style={{ width: 38 }} />
      </div>

      <div className="chat-list">
        <button className="chat-row" onClick={() => (myStatus ? setViewing(myStatus) : setComposing(true))}>
          <div style={{ position: "relative" }}>
            <Avatar name={profile.name} emoji={profile.emoji} color={profile.color} size={50} />
            {!myStatus && (
              <span className="status-add-badge"><Plus size={12} color="#07130F" /></span>
            )}
          </div>
          <div className="chat-row-mid">
            <div className="chat-row-top"><span className="chat-row-name">حالتي</span></div>
            <div className="chat-row-bottom"><span className="chat-row-preview">{myStatus ? myStatus.text : "أضف تحديثًا"}</span></div>
          </div>
        </button>

        {friendStatuses.length > 0 && <div className="status-section-label">تحديثات جديدة</div>}
        {friendStatuses.map((s) => (
          <button key={s.userId} className="chat-row" onClick={() => setViewing(s)}>
            <span className="status-ring"><Avatar name={s.name} emoji={s.emoji} color={s.color} size={46} /></span>
            <div className="chat-row-mid">
              <div className="chat-row-top"><span className="chat-row-name">{s.name}</span><span className="chat-row-time">{fmtTime(s.ts)}</span></div>
              <div className="chat-row-bottom"><span className="chat-row-preview">{s.text}</span></div>
            </div>
          </button>
        ))}
      </div>

      {composing && <StatusComposer onClose={() => setComposing(false)} onPost={postStatus} />}
      {viewing && <StatusViewer status={viewing} mine={viewing.userId === profile.id} onDelete={deleteStatus} onClose={() => setViewing(null)} />}
    </div>
  );
}

function StatusComposer({ onClose, onPost }) {
  const [text, setText] = useState("");
  const [bg, setBg] = useState(STATUS_BG[0]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-title">تحديث جديد</div>
        <div className="status-preview" style={{ background: bg }}>
          <textarea className="status-textarea" placeholder="اكتب شيئًا…" value={text} maxLength={120}
            onChange={(e) => setText(e.target.value)} autoFocus />
        </div>
        <div className="swatch-row" style={{ marginTop: 14, justifyContent: "center" }}>
          {STATUS_BG.map((c) => (
            <button key={c} className={"swatch" + (bg === c ? " swatch-active" : "")} style={{ background: c }} onClick={() => setBg(c)} />
          ))}
        </div>
        <button className="primary-btn" disabled={!text.trim()} onClick={() => onPost(text.trim(), bg)}>نشر التحديث</button>
      </div>
    </div>
  );
}

function StatusViewer({ status, mine, onDelete, onClose }) {
  useEffect(() => {
    const t = setTimeout(onClose, 6000);
    return () => clearTimeout(t);
  }, [status, onClose]);
  return (
    <div className="status-viewer" style={{ background: status.bg }} onClick={onClose}>
      <div className="status-viewer-progress"><span /></div>
      <div className="status-viewer-header">
        <Avatar name={status.name} emoji={status.emoji} color={status.color} size={34} />
        <span className="status-viewer-name">{status.name}</span>
        <span className="status-viewer-time">{fmtTime(status.ts)}</span>
      </div>
      <div className="status-viewer-text">{status.text}</div>
      {mine && (
        <button className="status-delete-btn" onClick={(e) => { e.stopPropagation(); onDelete(); onClose(); }}>
          <Trash2 size={16} color="#fff" /> حذف
        </button>
      )}
    </div>
  );
}

function CreateGroupModal({ profile, onClose, onCreated }) {
  const [name, setName] = useState("");
  const [contacts, setContacts] = useState([]);
  const [selected, setSelected] = useState({});
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    (async () => {
      const cl = await sGet("chatlist", false);
      setContacts(Object.values((cl && cl.contacts) || {}));
    })();
  }, []);

  const toggle = (id) => setSelected((prev) => ({ ...prev, [id]: !prev[id] }));

  const create = async () => {
    const memberIds = Object.keys(selected).filter((id) => selected[id]);
    if (!name.trim() || memberIds.length === 0 || busy) return;
    setBusy(true);
    const groupId = `${Date.now()}_${Math.floor(Math.random() * 9999)}`;
    const members = [profile.id, ...memberIds];
    const group = { id: groupId, name: name.trim(), emoji: "👥", color: profile.color, members, createdBy: profile.id, createdAt: Date.now() };
    await sSet(`group:${groupId}`, group, true);
    for (const m of members) {
      await sSet(`groupmember:${m}:${groupId}`, { groupId, ts: Date.now() }, true);
    }
    setBusy(false);
    onCreated(group);
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-title">إنشاء مجتمع</div>
        <input className="text-input" placeholder="اسم المجتمع" value={name} onChange={(e) => setName(e.target.value)} />
        <label className="field-label">أضف أعضاء من محادثاتك</label>
        {contacts.length === 0 ? (
          <div className="search-msg">ابدأ محادثة مع أصدقائك أولًا لتضيفهم لمجتمع</div>
        ) : (
          <div className="member-list">
            {contacts.map((c) => (
              <button key={c.id} className={"member-row" + (selected[c.id] ? " member-row-active" : "")} onClick={() => toggle(c.id)}>
                <Avatar name={c.name} emoji={c.emoji} color={c.color} size={38} />
                <span className="member-row-name">{c.name}</span>
                {selected[c.id] && <Check size={18} color="var(--accent)" />}
              </button>
            ))}
          </div>
        )}
        <button className="primary-btn" disabled={!name.trim() || busy} onClick={create}>
          {busy ? <span className="spinner" /> : "إنشاء"}
        </button>
      </div>
    </div>
  );
}

function SearchModal({ profile, onClose, onFound }) {
  const [id, setId] = useState("");
  const [state, setState] = useState("idle"); // idle | loading | notfound | found | self
  const [result, setResult] = useState(null);

  const search = async () => {
    if (id.length !== 6) return;
    if (id === profile.id) { setState("self"); return; }
    setState("loading");
    const u = await sGet(`users:${id}`, true);
    if (u) { setResult(u); setState("found"); } else { setState("notfound"); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={(e) => e.stopPropagation()}>
        <div className="modal-handle" />
        <div className="modal-title">بحث بالمعرف</div>
        <div className="search-row">
          <input
            className="text-input mono-input" inputMode="numeric" maxLength={6}
            placeholder="مثال: 482913" value={id}
            onChange={(e) => { setId(e.target.value.replace(/\D/g, "").slice(0, 6)); setState("idle"); }}
            onKeyDown={(e) => e.key === "Enter" && search()}
            autoFocus
          />
          <button className="primary-btn small-btn" disabled={id.length !== 6} onClick={search}>بحث</button>
        </div>

        {state === "loading" && <div className="search-msg"><span className="spinner" /></div>}
        {state === "notfound" && <div className="search-msg">لا يوجد مستخدم بهذا المعرف</div>}
        {state === "self" && <div className="search-msg">هذا معرفك أنت 🙂</div>}
        {state === "found" && result && (
          <div className="found-card">
            <Avatar name={result.name} emoji={result.emoji} color={result.color} size={64} />
            <div className="found-name">{result.name}</div>
            <div className="id-mono found-id">{result.id}</div>
            <button className="primary-btn" onClick={() => onFound(result)}>بدء محادثة</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* -------------------------------- Chat screen ------------------------------ */
function ChatScreen({ profile, contact, onBack, onSent, onStartCall, coins, onSpendCoins }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [otherSeenTs, setOtherSeenTs] = useState(0);
  const [otherTyping, setOtherTyping] = useState(false);
  const [otherOnline, setOtherOnline] = useState(false);
  const [recording, setRecording] = useState(false);
  const [recSecs, setRecSecs] = useState(0);
  const [showGifts, setShowGifts] = useState(false);
  const [giftAnim, setGiftAnim] = useState(null);
  const giftQueueRef = useRef([]);
  const giftPlayingRef = useRef(false);
  const sendingRef = useRef(false);
  const isInitialLoadRef = useRef(true);

  const advanceGiftQueue = () => {
    const next = giftQueueRef.current.shift();
    if (!next) { giftPlayingRef.current = false; setGiftAnim(null); return; }
    giftPlayingRef.current = true;
    setGiftAnim(next);
    setTimeout(advanceGiftQueue, 2600);
  };
  const playGiftAnim = (gift) => {
    giftQueueRef.current.push(gift);
    if (!giftPlayingRef.current) advanceGiftQueue();
  };

  const knownKeys = useRef(new Set());
  const scrollRef = useRef(null);
  const convId = convIdOf(profile.id, contact.id);
  const mediaRecRef = useRef(null);
  const chunksRef = useRef([]);
  const recTimerRef = useRef(null);
  const recStreamRef = useRef(null);

  const loadNew = useCallback(async () => {
    const keys = await sList(`msg:${convId}:`, true);
    const fresh = keys.filter((k) => !knownKeys.current.has(k));
    if (fresh.length === 0) return;
    const got = [];
    for (const k of fresh) {
      const v = await sGet(k, true);
      if (v) got.push({ ...v, _key: k });
      knownKeys.current.add(k);
    }
    if (got.length) {
      setMessages((prev) => {
        const seen = new Set(prev.map((m) => m._key));
        const add = got.filter((m) => !seen.has(m._key));
        if (!add.length) return prev;
        return [...prev, ...add].sort((a, b) => a.ts - b.ts);
      });
      const freshGifts = got.filter((m) => m.type === "gift" && m.from !== profile.id);
      if (freshGifts.length && !isInitialLoadRef.current) {
        freshGifts.forEach((g) => playGiftAnim(g));
      }
    }
    isInitialLoadRef.current = false;
  }, [convId]);

  const checkOtherSeen = useCallback(async () => {
    const d = await sGet(`seen:${convId}:${contact.id}`, true);
    if (d) setOtherSeenTs(d.ts);
  }, [convId, contact.id]);

  const checkTyping = useCallback(async () => {
    const d = await sGet(`typing:${convId}:${contact.id}`, true);
    setOtherTyping(!!d && Date.now() - d.ts < 3000);
  }, [convId, contact.id]);

  const checkPresence = useCallback(async () => {
    const u = await sGet(`users:${contact.id}`, true);
    setOtherOnline(!!u && Date.now() - (u.lastSeen || 0) < 40000);
  }, [contact.id]);

  const markSeen = useCallback(async () => {
    await sSet(`seen:${convId}:${profile.id}`, { ts: Date.now() }, true);
  }, [convId, profile.id]);

  useEffect(() => {
    knownKeys.current = new Set();
    isInitialLoadRef.current = true;
    setMessages([]);
    loadNew(); markSeen(); checkOtherSeen(); checkTyping(); checkPresence();
    const iv = setInterval(() => { loadNew(); checkOtherSeen(); checkTyping(); markSeen(); }, 2200);
    const pv = setInterval(checkPresence, 10000);
    return () => { clearInterval(iv); clearInterval(pv); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [contact.id]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length, otherTyping]);

  const send = async (payload) => {
    if (sendingRef.current) return;
    sendingRef.current = true;
    try {
      const ts = Date.now();
      const key = `msg:${convId}:${ts}_${Math.floor(Math.random() * 9999)}`;
      const msg = { from: profile.id, to: contact.id, ts, _key: key, ...payload };
      await sSet(key, msg, true);
      knownKeys.current.add(key);
      setMessages((prev) => (prev.some((m) => m._key === key) ? prev : [...prev, msg]));
      const preview = payload.type === "voice" ? "🎤 رسالة صوتية" : payload.type === "gift" ? `🎁 ${payload.giftEmoji} هدية` : payload.text;
      await sSet(`lastmsg:${contact.id}:${convId}`, {
        convId, otherId: profile.id, otherName: profile.name, otherEmoji: profile.emoji,
        otherColor: profile.color, preview, ts, fromId: profile.id,
      }, true);
      onSent(contact, preview, ts);
      if (payload.type === "gift") playGiftAnim(msg);
    } finally {
      sendingRef.current = false;
    }
  };

  const sendText = async () => {
    const t = input.trim();
    if (!t) return;
    setInput("");
    await send({ type: "text", text: t });
    sSet(`typing:${convId}:${profile.id}`, { ts: 0 }, true);
  };

  const sendGift = async (gift) => {
    setShowGifts(false);
    if (coins < gift.cost) return "insufficient";
    const ok = await onSpendCoins(gift.cost);
    if (!ok) return "insufficient";
    await send({ type: "gift", giftId: gift.id, giftEmoji: gift.emoji, giftName: gift.name, cost: gift.cost });
    return "ok";
  };

  const onChangeInput = (v) => {
    setInput(v);
    sSet(`typing:${convId}:${profile.id}`, { ts: Date.now() }, true);
  };

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recStreamRef.current = stream;
      chunksRef.current = [];
      const rec = new MediaRecorder(stream);
      mediaRecRef.current = rec;
      rec.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      rec.onstop = async () => {
        const blob = new Blob(chunksRef.current, { type: "audio/webm" });
        const reader = new FileReader();
        reader.onloadend = async () => {
          await send({ type: "voice", audio: reader.result, duration: recSecs });
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach((t) => t.stop());
      };
      rec.start();
      setRecording(true);
      setRecSecs(0);
      recTimerRef.current = setInterval(() => {
        setRecSecs((s) => {
          if (s >= 59) { stopRecording(); return s; }
          return s + 1;
        });
      }, 1000);
    } catch (e) {
      setRecording(false);
    }
  };
  const stopRecording = () => {
    if (mediaRecRef.current && mediaRecRef.current.state !== "inactive") mediaRecRef.current.stop();
    clearInterval(recTimerRef.current);
    setRecording(false);
  };
  const cancelRecording = () => {
    if (mediaRecRef.current) { mediaRecRef.current.onstop = null; if (mediaRecRef.current.state !== "inactive") mediaRecRef.current.stop(); }
    if (recStreamRef.current) recStreamRef.current.getTracks().forEach((t) => t.stop());
    clearInterval(recTimerRef.current);
    setRecording(false);
  };

  let lastDay = null;

  return (
    <div className="screen">
      <div className="top-bar chat-top">
        <button className="icon-btn" onClick={onBack}><ArrowRight size={22} color="var(--text)" /></button>
        <Avatar name={contact.name} emoji={contact.emoji} color={contact.color} size={38} online={otherOnline} />
        <div className="chat-top-mid">
          <div className="chat-top-name">{contact.name}</div>
          <div className="chat-top-status">{otherTyping ? "يكتب الآن…" : otherOnline ? "متصل الآن" : "غير متصل"}</div>
        </div>
        <button className="icon-btn" onClick={() => onStartCall(contact, "audio")}><Phone size={20} color="var(--accent)" /></button>
        <button className="icon-btn" onClick={() => onStartCall(contact, "video")}><Video size={20} color="var(--accent)" /></button>
      </div>

      <div className="messages-area" ref={scrollRef}>
        {messages.map((m, i) => {
          const mine = m.from === profile.id;
          const showDay = dayLabel(m.ts) !== lastDay;
          lastDay = dayLabel(m.ts);
          const seen = mine && m.ts <= otherSeenTs;
          return (
            <React.Fragment key={i}>
              {showDay && <div className="day-chip"><span>{dayLabel(m.ts)}</span></div>}
              <div style={{ display: "flex", justifyContent: mine ? "flex-start" : "flex-end" }}>
                <div className={"bubble " + (mine ? "bubble-mine" : "bubble-other") + (m.type === "gift" ? " bubble-gift" : "")}>
                  {m.type === "voice" ? (
                    <VoiceBubble src={m.audio} duration={m.duration} mine={mine} />
                  ) : m.type === "gift" ? (
                    <div className="gift-bubble-content">
                      <span className="gift-bubble-emoji">{m.giftEmoji}</span>
                      <span className="gift-bubble-name">{m.giftName}</span>
                      <span className="gift-bubble-cost"><Coin size={12} /> {m.cost.toLocaleString()}</span>
                    </div>
                  ) : (
                    <span className="bubble-text">{m.text}</span>
                  )}
                  <span className="bubble-meta">
                    {fmtTime(m.ts)}
                    {mine && (seen ? <CheckCheck size={14} color="#22D3EE" /> : <Check size={14} color="rgba(255,255,255,.55)" />)}
                  </span>
                </div>
              </div>
            </React.Fragment>
          );
        })}
        {otherTyping && (
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div className="bubble bubble-other typing-bubble">
              <span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" />
            </div>
          </div>
        )}
      </div>

      <div className="input-bar">
        {recording ? (
          <div className="recording-row">
            <button className="icon-btn" onClick={cancelRecording}><X size={20} color="var(--danger)" /></button>
            <div className="recording-indicator">
              <span className="rec-dot" /> جارٍ التسجيل… {fmtClock(recSecs)}
            </div>
            <button className="send-btn" onClick={stopRecording}><Send size={19} color="#07130F" /></button>
          </div>
        ) : (
          <>
            <button className="icon-btn gift-trigger-btn" onClick={() => setShowGifts(true)}><Gift size={21} color="var(--accent-2)" /></button>
            <input
              className="chat-input" value={input} placeholder="اكتب رسالة…"
              onChange={(e) => onChangeInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); } }}
            />
            {input.trim() ? (
              <button className="send-btn" onClick={sendText}><Send size={19} color="#07130F" /></button>
            ) : (
              <button className="send-btn" onClick={startRecording}><Mic size={19} color="#07130F" /></button>
            )}
          </>
        )}
      </div>

      {showGifts && (
        <GiftPickerModal coins={coins} onClose={() => setShowGifts(false)} onPick={sendGift} />
      )}
      {giftAnim && <GiftAnimation gift={giftAnim} mine={giftAnim.from === profile.id} senderName={giftAnim.from === profile.id ? profile.name : contact.name} />}
    </div>
  );
}

/* ----------------------------- group chat screen ---------------------------- */
function GroupChatScreen({ profile, group, onBack }) {

  const [input, setInput] = useState("");
  const [recording, setRecording] = useState(false);
  const [recSecs, setRecSecs] = useState(0);
  const knownKeys = useRef(new Set());
  const scrollRef = useRef(null);
  const sendingRef = useRef(false);
  const mediaRecRef = useRef(null);
  const chunksRef = useRef([]);
  const recTimerRef = useRef(null);
  const recStreamRef = useRef(null);
  const convId = `group-${group.id}`;

  const loadNew = useCallback(async () => {
    const keys = await sList(`msg:${convId}:`, true);
    const fresh = keys.filter((k) => !knownKeys.current.has(k));
    if (fresh.length === 0) return;
    const got = [];
    for (const k of fresh) {
      const v = await sGet(k, true);
      if (v) got.push({ ...v, _key: k });
      knownKeys.current.add(k);
    }
    if (got.length) {
      setMessages((prev) => {
        const seen = new Set(prev.map((m) => m._key));
        const add = got.filter((m) => !seen.has(m._key));
        if (!add.length) return prev;
        return [...prev, ...add].sort((a, b) => a.ts - b.ts);
      });
    }
  }, [convId]);

  useEffect(() => {
    knownKeys.current = new Set();
    setMessages([]);
    loadNew();
    const iv = setInterval(loadNew, 2200);
    return () => clearInterval(iv);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [group.id]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages.length]);

  const send = async (payload) => {
    if (sendingRef.current) return;
    sendingRef.current = true;
    try {
      const ts = Date.now();
      const key = `msg:${convId}:${ts}_${Math.floor(Math.random() * 9999)}`;
      const msg = { from: profile.id, fromName: profile.name, fromEmoji: profile.emoji, fromColor: profile.color, ts, _key: key, ...payload };
      await sSet(key, msg, true);
      knownKeys.current.add(key);
      setMessages((prev) => (prev.some((m) => m._key === key) ? prev : [...prev, msg]));
    } finally {
      sendingRef.current = false;
    }
  };

  const sendText = async () => {
    const t = input.trim();
    if (!t) return;
    setInput("");

  const startRecording = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recStreamRef.current = stream;
      chunksRef.current = [];
      const rec = new MediaRecorder(stream);
      mediaRecRef.current = rec;
      rec.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      rec.onstop = async () => {
        const blob = new Blob(chunksRef.current, { type: "audio/webm" });
        const reader = new FileReader();
        reader.onloadend = async () => { await send({ type: "voice", audio: reader.result, duration: recSecs }); };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach((t) => t.stop());
      };
      rec.start();
      setRecording(true);
      setRecSecs(0);
      recTimerRef.current = setInterval(() => {
        setRecSecs((s) => { if (s >= 59) { stopRecording(); return s; } return s + 1; });
      }, 1000);
    } catch (e) { setRecording(false); }
  };
  const stopRecording = () => {
    if (mediaRecRef.current && mediaRecRef.current.state !== "inactive") mediaRecRef.current.stop();
    clearInterval(recTimerRef.current);
    setRecording(false);
  };
  const cancelRecording = () => {
    if (mediaRecRef.current) { mediaRecRef.current.onstop = null; if (mediaRecRef.current.state !== "inactive") mediaRecRef.current.stop(); }
    if (recStreamRef.current) recStreamRef.current.getTracks().forEach((t) => t.stop());
    clearInterval(recTimerRef.current);
    setRecording(false);
  };

  let lastDay = null;
  return (
    <div className="screen">
      <div className="top-bar chat-top">
        <button className="icon-btn" onClick={onBack}><ArrowRight size={22} color="var(--text)" /></button>
        <Avatar name={group.name} emoji={group.emoji || "👥"} color={group.color} size={38} />
        <div className="chat-top-mid">
          <div className="chat-top-name">{group.name}</div>
          <div className="chat-top-status" style={{ color: "var(--text-dim)" }}>{group.members.length} أعضاء</div>

        {messages.map((m, i) => {

          return (
            <React.Fragment key={i}>
              {showDay && <div className="day-chip"><span>{dayLabel(m.ts)}</span></div>}
